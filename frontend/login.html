<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2d">
  <title>Sign in — PayPilot AI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243a;
      --muted: #64748b;
      --line: #e1e7ef;
      --surface: #ffffff;
      --canvas: #f4f7fb;
      --navy: #101c2d;
      --blue: #2859d6;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .card {
      width: min(420px, calc(100% - 40px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(16, 28, 45, .08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.4px;
      margin-bottom: 6px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--navy);
      color: white;
    }
    h1 { font-size: 22px; margin: 18px 0 4px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input:focus-visible, button:focus-visible {
      outline: 3px solid #b7ccff;
      outline-offset: 1px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #1e46b5; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); }
    .message.error { color: var(--red); }
    .note { font-size: 13px; margin: 18px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-mark" aria-hidden="true">P</div>PayPilot AI</div>
    <h1 id="title">Loading…</h1>
    <p id="subtitle"></p>
    <form id="auth-form" hidden>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username"
             minlength="3" maxlength="64" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" minlength="12" maxlength="1024" required>
      <button id="submit" type="submit">Continue</button>
    </form>
    <div id="message" class="message" role="status"></div>
    <p class="note">PayPal Sandbox prototype. Use test data only.</p>
  </main>

  <script>
    const form = document.getElementById("auth-form");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    let setupRequired = false;

    function show(text, isError) {
      message.textContent = text;
      message.className = isError ? "message error" : "message";
    }

    async function init() {
      try {
        const response = await fetch("/api/auth/status", {
          headers: { "Accept": "application/json" }
        });
        const status = await response.json();
        if (!response.ok) throw new Error();
        if (status.authenticated) {
          window.location.replace("/");
          return;
        }
        setupRequired = status.setup_required === true;
        if (setupRequired) {
          title.textContent = "Create the owner account";
          subtitle.textContent =
            "First-time setup. Choose a username and a password of at least 12 characters.";
          submit.textContent = "Create account";
          password.autocomplete = "new-password";
        } else {
          title.textContent = "Sign in";
          subtitle.textContent = "Sign in to investigate PayPal Sandbox payments.";
          submit.textContent = "Sign in";
        }
        form.hidden = false;
      } catch {
        title.textContent = "Unavailable";
        show("The server could not be reached. Reload the page to try again.", true);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submit.disabled = true;
      show("");
      try {
        const response = await fetch(
          setupRequired ? "/api/auth/setup" : "/api/auth/login",
          {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: password.value
            })
          }
        );
        if (response.ok) {
          window.location.replace("/");
          return;
        }
        const messages = {
          401: "Invalid username or password.",
          409: "Setup is already complete. Reload and sign in.",
          422: "Check the username (3–64 letters, digits, . _ -) and the password (12+ characters).",
          429: "Too many failed attempts. Try again in a few minutes.",
          503: "Authentication is temporarily unavailable."
        };
        show(messages[response.status] || "Sign-in failed. Please try again.", true);
      } catch {
        show("The server could not be reached.", true);
      } finally {
        submit.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
